<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salas · GEB</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --papel:#EDF0F6; --blanco:#fff; --tinta:#141C33; --suave:#6B7690;
  --linea:#DCE2EC; --linea-f:#C3CBDA; --ahora:#FF2D55;
  --ok:#0E8F7E; --alto:#D02B4A; --naranja:#E67E22;
  --px-min:1.3; --rail:52px; --radio:10px;
  --sombra:0 1px 3px rgba(20,28,51,.07),0 8px 24px -12px rgba(20,28,51,.16);
  --pending:#FFF3E0; --pending-b:#E67E22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--papel);color:var(--tinta);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px;border-radius:4px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ── Barra ── */
.barra{background:var(--tinta);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.logo-wrap .logo{font-size:19px;font-weight:700;letter-spacing:.06em;line-height:1}
.logo-wrap .sub{font-size:11px;color:#93A0BE;letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:2px}
.barra .reloj{margin-left:auto;font-size:14px;color:#C6CFE4}
.btn-barra{border:1px solid #3A456A;border-radius:999px;padding:6px 14px;color:#C6CFE4;font-size:12px;letter-spacing:.1em;text-transform:uppercase;position:relative;transition:all .15s}
.btn-barra:hover{background:rgba(255,255,255,.08)}
.btn-barra[data-on="1"]{background:#fff;color:var(--tinta);border-color:#fff;font-weight:600}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:999px;background:var(--naranja);color:#fff;font-size:11px;font-weight:600;display:none;align-items:center;justify-content:center;padding:0 4px}
.badge.activo{display:flex}

/* ── Fechas ── */
.fechas{position:sticky;top:0;z-index:30;background:var(--blanco);border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.flecha{width:34px;height:34px;border:1px solid var(--linea-f);border-radius:8px;font-size:18px;color:var(--suave);display:flex;align-items:center;justify-content:center}
.flecha:hover{background:var(--papel)}
.inp-fecha{border:1px solid var(--linea-f);border-radius:8px;padding:7px 10px;background:#fff;min-width:0;outline:none}
.inp-fecha:focus{border-color:var(--tinta)}
.pill{border:1px solid var(--linea-f);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--suave)}
.pill:hover{background:var(--papel)}
.btn-apartar{margin-left:auto;background:var(--tinta);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;box-shadow:var(--sombra)}
.btn-apartar:hover{background:#22304f}
.dia-txt{font-weight:600;font-size:15px;text-transform:capitalize}

/* ── Sedes ── */
.sedes{display:flex;gap:7px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.sedes::-webkit-scrollbar{display:none}
.sede-chip{flex:0 0 auto;border:1px solid var(--linea-f);background:#fff;border-radius:999px;padding:7px 15px;font-size:13px;color:var(--suave);white-space:nowrap;transition:all .15s}
.sede-chip[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta);font-weight:600}

/* ── Strip ── */
.strip{display:flex;gap:8px;padding:10px 16px 4px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip-sala{flex:0 0 auto;background:var(--blanco);border-radius:var(--radio);padding:9px 12px;border-left:4px solid var(--c,#999);box-shadow:var(--sombra);min-width:130px}
.chip-sala b{display:block;font-size:12.5px;font-weight:600}
.chip-sala span{font-size:12px;color:var(--suave)}
.chip-sala .libre{color:var(--ok);font-weight:600}
.chip-sala .ocupada{color:var(--alto);font-weight:600}

/* ── Tablero ── */
.tablero-wrap{padding:10px 16px 60px}
.tablero{background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden}
.cabeceras{display:grid;position:sticky;top:56px;z-index:20;background:var(--blanco);border-bottom:1px solid var(--linea-f)}
.cab{padding:9px 8px;text-align:center;border-left:1px solid var(--linea)}
.cab:first-child{border-left:none}
.cab b{display:block;font-size:12.5px;font-weight:600;line-height:1.2}
.cab small{font-size:10.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
.cab .punto{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
.pista{display:grid;position:relative}
.rail{border-right:1px solid var(--linea-f);position:relative}
.rail .hora{position:absolute;left:0;right:0;padding-right:7px;text-align:right;font-size:11px;color:var(--suave);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--linea);cursor:crosshair}
.pista .col:first-of-type{border-left:none}
.lineas-h{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--linea) 1px,transparent 1px);background-size:100% calc(60px * var(--px-min))}
.col .hint{position:absolute;left:3px;right:3px;border-radius:7px;border:1.5px dashed var(--linea-f);display:none;align-items:center;justify-content:center;font-size:11px;color:var(--suave);pointer-events:none;background:rgba(255,255,255,.7)}
.col:hover .hint{display:flex}

/* Bloques */
.bloque{position:absolute;left:3px;right:3px;border-radius:7px;padding:5px 7px;overflow:hidden;color:#fff;text-align:left;display:block;line-height:1.2;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);cursor:pointer}
.bloque:hover{filter:brightness(1.1)}
.bloque b{font-size:12px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloque span{font-size:10.5px;opacity:.85;display:block}
.bloque.corta{padding:3px 7px;display:flex;align-items:center;gap:5px}
.bloque.corta b{font-size:11px}.bloque.corta span{display:none}
.bloque.pendiente{background:repeating-linear-gradient(135deg,rgba(230,126,34,.6) 0 6px,var(--c) 6px 12px)}
.bloque.pendiente::after{content:'⏳';position:absolute;right:4px;top:3px;font-size:10px}

/* Línea de ahora */
.linea-ahora{position:absolute;left:0;right:0;height:0;z-index:15;pointer-events:none}
.linea-ahora::before{content:'';position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--ahora)}
.linea-ahora .globo{position:absolute;left:0;top:-9px;background:var(--ahora);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:0 5px 5px 0;letter-spacing:.03em}

/* ── Velo / Modal ── */
.velo{position:fixed;inset:0;background:rgba(20,28,51,.5);z-index:80;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.velo.abierto{display:flex}
.hoja{background:var(--papel);width:100%;max-width:500px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:sube .2s ease-out}
@media(min-width:600px){.velo{align-items:center}.hoja{border-radius:14px;max-height:88vh}}
@keyframes sube{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.hoja h2{font-size:20px;font-weight:700;margin:0 0 2px}
.hoja .paso{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);margin-bottom:14px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;padding:11px 12px;border:1px solid var(--linea-f);border-radius:9px;background:#fff;outline:none;font-size:14px}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--tinta)}
.campo textarea{resize:vertical;min-height:70px}
.resumen-bloque{background:var(--tinta);color:#fff;border-radius:11px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.resumen-bloque b{display:block;font-size:15px;font-weight:700;margin-bottom:2px}
.resumen-bloque span{color:#AFBBD6;font-size:12.5px}
.av-error{background:#FBE9EC;border:1px solid #F0BCC6;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.acciones{display:flex;gap:9px;margin-top:14px}
.acciones button{flex:1;padding:13px;border-radius:10px;font-weight:600;font-size:15px}
.btn-f{border:1px solid var(--linea-f);background:#fff;color:var(--suave)}
.btn-s{background:var(--tinta);color:#fff}
.btn-s:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--naranja);color:#fff}
.btn-danger{background:var(--alto);color:#fff}
.folio-caja{text-align:center;padding:20px 0}
.folio-caja .n{font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;letter-spacing:.12em;color:var(--ok)}
.folio-caja p{color:var(--suave);font-size:13px;margin-top:4px}

/* Detalle */
.det-fila{display:flex;justify-content:space-between;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--linea);font-size:.88rem}
.det-fila:last-child{border-bottom:none}
.det-fila span:first-child{color:var(--suave);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.det-fila span:last-child{font-weight:500;text-align:right}

/* ── Panel Admin ── */
.panel{position:fixed;inset:0;background:var(--papel);z-index:70;display:none;flex-direction:column}
.panel.abierto{display:flex}
.panel-barra{background:var(--tinta);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.panel-barra h2{font-size:17px;font-weight:700;margin:0}
.panel-barra .cerrar{margin-left:auto;color:#C6CFE4;font-size:13px;padding:6px 12px;border-radius:7px;border:1px solid #3A456A}
.panel-barra .cerrar:hover{background:rgba(255,255,255,.08)}
.panel-cuerpo{flex:1;overflow-y:auto;padding:14px}
.ev-card{background:#fff;border-radius:11px;padding:13px;margin-bottom:8px;box-shadow:var(--sombra);border-left:5px solid var(--c,var(--linea));display:flex;align-items:center;gap:10px}
.ev-card.pendiente-card{border-left-color:var(--naranja);background:var(--pending)}
.ev-info .ev-sede{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--suave)}
.ev-info .ev-titulo{font-weight:500;font-size:.92rem}
.ev-info .ev-hora{font-size:.82rem;color:var(--suave)}
.ev-info .ev-pending{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--naranja);margin-left:.4rem}
.ev-acciones{display:flex;flex-direction:column;gap:.35rem;margin-left:auto}
.btn-ev{padding:.3rem .7rem;border-radius:6px;font-size:.78rem;font-weight:600;white-space:nowrap;cursor:pointer}
.btn-ev-del{border:1px solid var(--alto);color:var(--alto);background:none}
.btn-ev-del:hover{background:var(--alto);color:#fff}
.btn-ev-ok{border:1px solid var(--ok);color:var(--ok);background:none}
.btn-ev-ok:hover{background:var(--ok);color:#fff}
.btn-ev-no{border:1px solid var(--suave);color:var(--suave);background:none}
.btn-ev-no:hover{border-color:var(--tinta);color:var(--tinta)}
.vacio-msg{text-align:center;color:var(--suave);padding:40px 20px;font-size:13.5px}
.cargando{text-align:center;color:var(--suave);padding:40px 20px}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;z-index:95;box-shadow:var(--sombra);max-width:90vw;text-align:center}
.toast.malo{background:var(--alto)}

/* Tip popup */
.tip{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;border-radius:12px;padding:1rem 1.25rem 1rem 1rem;max-width:360px;width:calc(100% - 2rem);z-index:300;display:flex;gap:.85rem;align-items:flex-start;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:sube .3s ease}
.tip-icon{font-size:1.5rem;flex-shrink:0;line-height:1}
.tip-body{flex:1}
.tip-title{font-weight:600;font-size:.9rem;margin-bottom:.2rem}
.tip-txt{font-size:.82rem;opacity:.75;line-height:1.45}
.tip-close{background:none;border:none;color:#fff;opacity:.5;cursor:pointer;font-size:1.1rem;padding:0;flex-shrink:0;line-height:1}
.tip-close:hover{opacity:1}
</style>
</head>
<body>

<header class="barra">
  <div class="logo-wrap">
    <span class="logo">SALAS</span>
    <span class="sub">Grupo GEB</span>
  </div>
  <div class="reloj mono" id="reloj">--:--</div>
  <button class="btn-barra" id="btnAdmin">Admin<span class="badge" id="badgeAdmin"></span></button>
</header>

<nav class="fechas">
  <button class="flecha" id="prevDia">&#8249;</button>
  <input type="date" class="inp-fecha" id="inpFecha">
  <button class="flecha" id="nextDia">&#8250;</button>
  <button class="pill" id="btnHoy">Hoy</button>
  <span class="dia-txt" id="diaTxt"></span>
  <button class="btn-apartar" id="btnApartar">Apartar sala</button>
</nav>

<div class="sedes" id="sedes"></div>
<div class="strip" id="strip"></div>

<div class="tablero-wrap">
  <div class="tablero">
    <div class="cabeceras" id="cabeceras"></div>
    <div class="pista" id="pista"></div>
  </div>
</div>

<!-- Velo modal genérico -->
<div class="velo" id="velo"><div class="hoja" id="hoja"></div></div>

<!-- Panel Admin -->
<div class="panel" id="panel">
  <div class="panel-barra">
    <h2>Panel Admin</h2>
    <button class="cerrar" id="cerrarPanel">Cerrar</button>
  </div>
  <div class="panel-cuerpo" id="panelCuerpo"></div>
</div>

<!-- Tip -->
<div class="tip" id="tip" style="display:none">
  <div class="tip-icon">💡</div>
  <div class="tip-body">
    <div class="tip-title">¿Necesitas cancelar una reserva?</div>
    <div class="tip-txt">Toca cualquier bloque ocupado y podrás solicitar su eliminación. Un admin la aprobará.</div>
  </div>
  <button class="tip-close" id="tipClose">✕</button>
</div>

<script>
// ═══════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════
const CFG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbw6ZpgMj5SCQMsP5Gf244I0uuEFQm0jv0j__7J_ukMePSorisiq-gJ3a_w9OFmJ81f9AQ/exec',
  ADMIN_PASSWORD:  'admin2024',
  ADMIN_EMAIL:     'universidadgeb@gmail.com',
  HOUR_START: 5, HOUR_END: 24, SLOT_MIN: 30,
  PX_MIN: 1.3,
  SEDES: {
    'Vivo47 Naciones': [
      { id:'local-k',     nombre:'Local K',    capacidad:8,  color:'#2E4EC7', calId:'b489990a82f312bd57eb16d356b7a852c37e11ade98039ee3011a899b513d17c@group.calendar.google.com' },
      { id:'universidad', nombre:'Universidad', capacidad:50, color:'#0E8F7E', calId:'a3fd1245fe878340f0d05166e419c6ebe2f30cae542a1e5c5c9c52ebec9ceeaa@group.calendar.google.com' }
    ],
    'Vivo47 Center': [
      { id:'amor',     nombre:'Amor',     capacidad:5,  color:'#C94B8C', calId:'a3d4a39c371a100fe43877370036e06832f715a7140406c884cab139a269ced3@group.calendar.google.com' },
      { id:'cuidado',  nombre:'Cuidado',  capacidad:5,  color:'#C77D18', calId:'85bbcbcb3e853108c12f4f31dfc9183178ac118cecf4776e20074d47b23ff0c3@group.calendar.google.com' },
      { id:'servicio', nombre:'Servicio', capacidad:15, color:'#6E4BB5', calId:'8407baea9a214403ca9058f0608421983871d4fe8851195b0014d0e419004890@group.calendar.google.com' }
    ]
  }
};

const DELETE_PREFIX = '[BORRAR]';
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };

// ═══════════════════════════════════════
//  ESTADO
// ═══════════════════════════════════════
const S = {
  fecha: isoHoy(),
  sede: lsGet('geb_sede') || 'Vivo47 Naciones',
  events: {},         // { salaId: [eventos] }
  adminOpen: false,
  adminAuth: false
};

function salasActuales() { return CFG.SEDES[S.sede] || []; }
function salaById(id)    { return Object.values(CFG.SEDES).flat().find(s => s.id === id); }

// ═══════════════════════════════════════
//  TIEMPO
// ═══════════════════════════════════════
function isoHoy() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' });
}
function fmtFecha(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
}
function hhmm(d) {
  return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
}
function aMin(hm) { const [h,m]=hm.split(':').map(Number); return h*60+m; }
function aHM(min) { return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`; }
function minActual() {
  const n=new Date(); return n.getHours()*60+n.getMinutes();
}

function reloj() {
  document.getElementById('reloj').textContent = hhmm(new Date());
}
setInterval(reloj,10000); reloj();

// ═══════════════════════════════════════
//  API  (Apps Script proxy)
// ═══════════════════════════════════════
async function fetchEvents(calId) {
  const url = `${CFG.APPS_SCRIPT_URL}?action=getEvents&calendarId=${encodeURIComponent(calId)}&date=${S.fecha}`;
  const res = await fetch(url, { redirect:'follow' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'Error al leer eventos');
  return data.items || [];
}
async function callProxy(payload) {
  const res = await fetch(CFG.APPS_SCRIPT_URL, { method:'POST', body:JSON.stringify(payload), redirect:'follow' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'Error en proxy');
  return data;
}
const createEvent = (calId,title,startISO,endISO) => callProxy({action:'create',calendarId:calId,title,startISO,endISO});
const deleteEvent = (calId,eventId) => callProxy({action:'delete',calendarId:calId,eventId});

// ═══════════════════════════════════════
//  CARGA
// ═══════════════════════════════════════
async function cargarSede() {
  const salas = salasActuales();
  // Mostrar tablero vacío mientras carga
  renderTablero(true);
  const resultados = await Promise.allSettled(salas.map(s => fetchEvents(s.calId)));
  resultados.forEach((r,i) => {
    S.events[salas[i].id] = r.status === 'fulfilled' ? r.value : [];
  });
  renderTablero(false);
  renderStrip();
  actualizarBadge();
}

async function cargarTodas() {
  const todasSalas = Object.values(CFG.SEDES).flat();
  const resultados = await Promise.allSettled(todasSalas.map(s => fetchEvents(s.calId)));
  resultados.forEach((r,i) => {
    S.events[todasSalas[i].id] = r.status === 'fulfilled' ? r.value : [];
  });
}

// ═══════════════════════════════════════
//  FUNCIONES DE EVENTO
// ═══════════════════════════════════════
function isPending(ev) { return ev.summary && ev.summary.startsWith(DELETE_PREFIX); }
function cleanTitle(summary) {
  if (!summary) return '(sin título)';
  if (summary.startsWith(DELETE_PREFIX)) return summary.replace(DELETE_PREFIX,'').replace(/\s*\(solicitó:.*?\)\s*$/, '').trim();
  return summary;
}
function evStartMin(ev) {
  const d = new Date(ev.start.dateTime || ev.start.date);
  return d.getHours()*60 + d.getMinutes();
}
function evEndMin(ev) {
  const d = new Date(ev.end.dateTime || ev.end.date);
  return d.getHours()*60 + d.getMinutes();
}

// ═══════════════════════════════════════
//  RENDERIZADO
// ═══════════════════════════════════════
const escapa = t => String(t==null?'':t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function renderSedes() {
  const cont = document.getElementById('sedes');
  const sedes = Object.keys(CFG.SEDES);
  if (!S.sede || !sedes.includes(S.sede)) S.sede = sedes[0];
  cont.innerHTML = sedes.map(sd =>
    `<button class="sede-chip" aria-pressed="${sd===S.sede}" data-sede="${escapa(sd)}">${escapa(sd)}</button>`
  ).join('');
  cont.querySelectorAll('.sede-chip').forEach(b => b.onclick = async () => {
    S.sede = b.dataset.sede;
    lsSet('geb_sede', S.sede);
    renderSedes();
    await cargarSede();
  });
}

function renderTablero(loading) {
  const salas = salasActuales();
  const minIni = CFG.HOUR_START * 60;
  const minFin = CFG.HOUR_END   * 60;
  const PX = CFG.PX_MIN;
  const alto = (minFin - minIni) * PX;
  const y = min => (min - minIni) * PX;
  const cols = `${CFG.PX_MIN > 0 ? 52 : 52}px repeat(${salas.length},minmax(80px,1fr))`;

  // Cabeceras
  const cabEl = document.getElementById('cabeceras');
  cabEl.style.gridTemplateColumns = cols;
  cabEl.innerHTML = '<div class="cab"></div>' + salas.map(s => {
    const ev = (S.events[s.id]||[]).find(e => {
      const m = minActual(); return evStartMin(e) <= m && evEndMin(e) > m;
    });
    return `<div class="cab">
      <b><span class="punto" style="background:${s.color}"></span>${escapa(s.nombre)}</b>
      <small>${s.capacidad} personas</small>
    </div>`;
  }).join('');

  // Pista
  const pistaEl = document.getElementById('pista');
  pistaEl.style.gridTemplateColumns = cols;

  if (loading) {
    pistaEl.innerHTML = `<div class="rail" style="height:${alto}px"></div>` +
      salas.map(() => `<div class="col" style="height:${alto}px"><div class="cargando" style="padding:20px 0;font-size:12px">Cargando…</div></div>`).join('');
    return;
  }

  let html = `<div class="rail" style="height:${alto}px">`;
  for (let m = minIni; m <= minFin; m += 60)
    html += `<div class="hora mono" style="top:${y(m)}px">${aHM(m)}</div>`;
  html += '</div>';

  salas.forEach(sala => {
    html += `<div class="col" data-sala="${sala.id}" style="height:${alto}px">
      <div class="lineas-h"></div>
      <div class="hint">+ Apartar</div>`;

    (S.events[sala.id] || []).forEach(ev => {
      const top  = y(evStartMin(ev));
      const dur  = evEndMin(ev) - evStartMin(ev);
      const h    = Math.max(dur * PX - 2, 20);
      const pend = isPending(ev);
      const title = cleanTitle(ev.summary);
      html += `<button class="bloque${dur<=30?' corta':''}${pend?' pendiente':''}"
        data-ev="${escapa(ev.id)}" data-sala="${sala.id}"
        style="--c:${sala.color};top:${top}px;height:${h}px">
        <b>${escapa(title)}</b>
        <span>${aHM(evStartMin(ev))}–${aHM(evEndMin(ev))}</span>
      </button>`;
    });
    html += '</div>';
  });
  pistaEl.innerHTML = html;

  // Línea de ahora
  if (S.fecha === isoHoy()) {
    const m = minActual();
    if (m >= minIni && m <= minFin) {
      const l = document.createElement('div');
      l.className = 'linea-ahora'; l.style.top = y(m)+'px';
      l.innerHTML = `<span class="globo mono">${hhmm(new Date())}</span>`;
      pistaEl.appendChild(l);
    }
  }

  // Eventos de click
  pistaEl.querySelectorAll('.col').forEach(col => {
    col.addEventListener('click', e => {
      if (e.target.closest('.bloque')) return;
      const sala = salaById(col.dataset.sala);
      if (!sala) return;
      const rect = col.getBoundingClientRect();
      const relY = e.clientY - rect.top + col.scrollTop;
      const min = minIni + Math.round(relY / PX / CFG.SLOT_MIN) * CFG.SLOT_MIN;
      const hm = aHM(Math.min(Math.max(min, minIni), minFin - CFG.SLOT_MIN));
      abrirReserva({ sala, hm });
    });
  });

  pistaEl.querySelectorAll('.bloque').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const sala = salaById(b.dataset.sala);
      const evId = b.dataset.ev;
      const ev = (S.events[b.dataset.sala]||[]).find(e => e.id === evId);
      if (sala && ev) abrirDetalle(sala, ev);
    });
  });
}

function renderStrip() {
  const ahora = new Date();
  const esHoy = S.fecha === isoHoy();
  document.getElementById('strip').innerHTML = salasActuales().map(s => {
    const evs = S.events[s.id] || [];
    let estado;
    if (esHoy) {
      const m = minActual();
      const activa = evs.find(e => evStartMin(e) <= m && evEndMin(e) > m);
      if (activa) {
        estado = `<span class="ocupada">Ocupada</span> <span>hasta ${aHM(evEndMin(activa))}</span>`;
      } else {
        const sig = evs.filter(e => evStartMin(e) > m).sort((a,b) => evStartMin(a)-evStartMin(b))[0];
        estado = `<span class="libre">Libre</span> <span>${sig ? 'hasta '+aHM(evStartMin(sig)) : 'el resto del día'}</span>`;
      }
    } else {
      const n = evs.length;
      estado = `<span>${n === 0 ? 'Sin reservas' : n + (n===1?' reserva':' reservas')}</span>`;
    }
    return `<div class="chip-sala" style="--c:${s.color}"><b>${escapa(s.nombre)}</b>${estado}</div>`;
  }).join('');
}

let R = null;

function abrirReserva(pre = {}) {
  R = {
    sala: pre.sala || salasActuales()[0],
    hm:   pre.hm   || aHM(Math.max(aMin(aHM(minActual())), CFG.HOUR_START * 60)),
    dur:  60,
    nombre: '', desc: ''
  };
  mostrarFormReserva();
  document.getElementById('velo').classList.add('abierto');
}

function mostrarFormReserva() {
  const salas = salasActuales();
  const minIni = CFG.HOUR_START * 60;
  const minFin = CFG.HOUR_END   * 60;

  // Opciones de hora inicio
  let opIni = '';
  for (let m = minIni; m < minFin; m += CFG.SLOT_MIN)
    opIni += `<option value="${aHM(m)}" ${aHM(m)===R.hm?'selected':''}>${aHM(m)}</option>`;

  // Opciones de hora fin
  const startMin = aMin(R.hm);
  const usedByOthers = (salaId) => {
    return (S.events[salaId] || []).filter(e => !isPending(e)).some(e =>
      evStartMin(e) < startMin + R.dur && evEndMin(e) > startMin
    );
  };

  let opFin = '';
  for (let d = CFG.SLOT_MIN; startMin + d <= minFin; d += CFG.SLOT_MIN) {
    const h = Math.floor(d/60), m = d%60;
    const label = d < 60 ? `${d} min` : (m===0 ? `${h}${h===1?' hora':' horas'}` : `${h}h ${m}min`);
    opFin += `<option value="${d}" ${d===R.dur?'selected':''}>${label}</option>`;
  }

  document.getElementById('hoja').innerHTML = `
    <h2>Apartar sala</h2>
    <div class="paso">${escapa(S.sede)} · ${escapa(fmtFecha(S.fecha))}</div>
    <div class="campo"><label>Sala</label>
      <select id="r-sala">
        ${salas.map(s => `<option value="${s.id}" ${s.id===R.sala.id?'selected':''}>${escapa(s.nombre)} (${s.capacidad} personas)</option>`).join('')}
      </select></div>
    <div class="campo" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label>Empieza</label><select id="r-ini">${opIni}</select></div>
      <div><label>Duración</label><select id="r-dur">${opFin}</select></div>
    </div>
    <div class="campo"><label>Tu nombre</label>
      <input type="text" id="r-nombre" value="${escapa(R.nombre)}" placeholder="Nombre y apellido" autocomplete="name"></div>
    <div class="campo"><label>Descripción <span style="font-weight:400;color:var(--suave)">(opcional)</span></label>
      <textarea id="r-desc" placeholder="¿Para qué es la reunión?">${escapa(R.desc)}</textarea></div>
    <div id="r-av"></div>
    <div class="acciones">
      <button class="btn-f" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-s" id="r-btn" onclick="guardarReserva()">Apartar sala</button>
    </div>`;

  document.getElementById('r-sala').onchange = e => { R.sala = salaById(e.target.value) || R.sala; };
  document.getElementById('r-ini').onchange  = e => { R.hm = e.target.value; };
  document.getElementById('r-dur').onchange  = e => { R.dur = +e.target.value; };
  setTimeout(() => document.getElementById('r-nombre').focus(), 100);
}

async function guardarReserva() {
  R.nombre = document.getElementById('r-nombre').value.trim();
  R.desc   = document.getElementById('r-desc').value.trim();
  const av  = document.getElementById('r-av');
  const btn = document.getElementById('r-btn');
  av.innerHTML = '';
  if (!R.nombre) { av.innerHTML = '<div class="av-error">Por favor ingresa tu nombre.</div>'; return; }

  const startMin = aMin(R.hm);
  const endMin   = startMin + R.dur;
  if (endMin > CFG.HOUR_END * 60) { av.innerHTML = '<div class="av-error">La reserva se sale del horario disponible.</div>'; return; }

  // Verificar solapamiento local
  const choque = (S.events[R.sala.id]||[]).filter(e => !isPending(e)).some(e =>
    evStartMin(e) < endMin && evEndMin(e) > startMin
  );
  if (choque) { av.innerHTML = '<div class="av-error">Ese horario ya está ocupado en esta sala.</div>'; return; }

  btn.disabled = true; btn.textContent = 'Apartando…';

  const startISO = `${S.fecha}T${R.hm}:00`;
  const endISO   = `${S.fecha}T${aHM(endMin)}:00`;
  const title    = R.desc ? `[${R.nombre}] ${R.desc}` : `[${R.nombre}] Reserva`;

  try {
    await createEvent(R.sala.calId, title, startISO, endISO);
    document.getElementById('hoja').innerHTML = `
      <h2>¡Sala apartada!</h2>
      <div class="paso">${escapa(R.sala.nombre)}</div>
      <div class="resumen-bloque" style="background:${R.sala.color}">
        <b>${escapa(R.sala.nombre)}</b>
        <span>${escapa(fmtFecha(S.fecha))} · ${R.hm} a ${aHM(endMin)} · ${escapa(S.sede)}</span>
      </div>
      <p style="color:var(--suave);font-size:13px;margin:0 0 8px">Si necesitas cancelar, toca el bloque en el tablero y solicita su eliminación.</p>
      <button class="btn-s" style="width:100%;padding:13px;border-radius:10px;font-weight:600" onclick="cerrarModal();cargarSede()">Listo</button>`;
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Apartar sala';
    av.innerHTML = `<div class="av-error">No se pudo reservar: ${escapa(e.message)}</div>`;
  }
}

// Carga eventos de una sala en un rango de fechas (isoDesde, diasAdelante)
async function fetchEventosRango(sala, isoDesde, diasAdelante) {
  const resultados = [];
  const [y,m,d] = isoDesde.split('-').map(Number);
  const fetchDia = async (offset) => {
    const dt = new Date(y,m-1,d+offset);
    const iso = dt.toLocaleDateString('en-CA');
    const evs = await fetchEvents(sala.calId, iso).catch(() => []);
    return evs.map(ev => ({ sala, ev, fecha: iso,
      sede: Object.keys(CFG.SEDES).find(k => CFG.SEDES[k].some(s=>s.id===sala.id)) }));
  };
  const dias = await Promise.all(Array.from({length:diasAdelante},(_,i)=>fetchDia(i)));
  return dias.flat();
}

// fetchEvents necesita aceptar iso como parámetro (no solo S.fecha)
async function fetchEventsForDate(calId, iso) {
  const url = `${CFG.APPS_SCRIPT_URL}?action=getEvents&calendarId=${encodeURIComponent(calId)}&date=${iso}`;
  const res = await fetch(url, { redirect:'follow' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'Error');
  return data.items || [];
}

async function pintarPanel() {
  const cont = document.getElementById('panelCuerpo');
  cont.innerHTML = '<div class="cargando">Cargando eventos de los próximos 14 días…</div>';

  const todasSalas = Object.values(CFG.SEDES).flat();
  const hoy = isoHoy();

  // Cargar 14 días para todas las salas en paralelo
  const todos = await Promise.all(
    todasSalas.map(sala =>
      Promise.all(
        Array.from({length:14},(_,i) => {
          const [y,m,d] = hoy.split('-').map(Number);
          const dt = new Date(y,m-1,d+i);
          const iso = dt.toLocaleDateString('en-CA');
          return fetchEventsForDate(sala.calId, iso)
            .then(evs => evs.map(ev => ({
              sala, ev, fecha: iso,
              sede: Object.keys(CFG.SEDES).find(k => CFG.SEDES[k].some(s=>s.id===sala.id))
            })))
            .catch(() => []);
        })
      ).then(r => r.flat())
    )
  );

  let items = todos.flat();
  items.sort((a,b) => new Date(a.ev.start.dateTime||a.ev.start.date) - new Date(b.ev.start.dateTime||b.ev.start.date));

  const pendientes = items.filter(x => isPending(x.ev));
  const normales   = items.filter(x => !isPending(x.ev));

  if (!items.length) {
    cont.innerHTML = '<div class="vacio-msg">No hay eventos en los próximos 14 días.</div>';
    return;
  }

  const evCard = ({ sala, ev, fecha, sede }) => {
    const ini = new Date(ev.start.dateTime || ev.start.date);
    const fin = new Date(ev.end.dateTime   || ev.end.date);

    const endISO   = ev.end.dateTime   || ev.end.date;

        <div class="ev-info" style="flex:1">

        </div>

        </div>
      </div>`;
    }
    return `<div class="ev-card" id="ev-${escapa(ev.id)}" style="--c:${sala.color}">
      <div class="ev-info" style="flex:1">
        <div class="ev-sede">${escapa(sede)} · ${escapa(sala.nombre)}</div>
        <div class="ev-titulo">${escapa(cleanTitle(ev.summary))}</div>

  };

  cont.innerHTML =
    (pendientes.length ? `<p style="font-size:12px;font-weight:700;color:var(--naranja);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em">⏳ Solicitudes pendientes (${pendientes.length})</p>` + pendientes.map(evCard).join('') : '') +
    (normales.length   ? `<p style="font-size:12px;color:var(--suave);margin:${pendientes.length?'16px':0} 0 8px;text-transform:uppercase;letter-spacing:.08em">Todas las reservas · próximos 14 días</p>` + normales.map(evCard).join('') : '');
}

async function aprobarElim(calId, eventId) {
  if (!confirm('¿Aprobar la eliminación?')) return;
  const el = document.getElementById(`ev-${eventId}`);
  try {
    await deleteEvent(calId, eventId);
    el?.remove();
    toast('Reserva eliminada');
    actualizarBadge();
  } catch(e) { toast(e.message, true); }
}

async function rechazarElim(calId, eventId, origTitle, startISO, endISO) {
  if (!confirm('¿Rechazar y restaurar la reserva?')) return;
  const el = document.getElementById(`ev-${eventId}`);
  try {
    await deleteEvent(calId, eventId);
    const restored = origTitle.replace(/^\[BORRAR\]\s*/,'').replace(/\s*\(solicitó:.*?\)\s*$/,'');
    await createEvent(calId, restored, startISO, endISO);
    el?.remove();
    toast('Reserva restaurada');
    await cargarTodas(); pintarPanel();
  } catch(e) { toast(e.message, true); }
}

async function elimAdmin(calId, eventId) {
  if (!confirm('¿Eliminar esta reserva?')) return;
  const el = document.getElementById(`ev-${eventId}`);
  try {
    await deleteEvent(calId, eventId);
    el?.remove();
    toast('Reserva eliminada');
  } catch(e) { toast(e.message, true); }
}

// ═══════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════
function toast(msg, malo) {
  const t = document.createElement('div');
  t.className = 'toast' + (malo ? ' malo' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), malo ? 5200 : 3000);
}

// ═══════════════════════════════════════
//  TIP
// ═══════════════════════════════════════
function showTipIfNeeded() {
  if (lsGet('geb-tip-seen')) return;
  setTimeout(() => { document.getElementById('tip').style.display = 'flex'; }, 1400);
}
function dismissTip() {
  document.getElementById('tip').style.display = 'none';
  lsSet('geb-tip-seen', '1');
}
document.getElementById('tipClose').onclick = dismissTip;

// ═══════════════════════════════════════
//  NAVEGACIÓN DE FECHA
// ═══════════════════════════════════════
function setFecha(iso) {
  S.fecha = iso;
  document.getElementById('inpFecha').value = iso;
  document.getElementById('diaTxt').textContent = fmtFecha(iso);
  cargarSede();
  if (S.adminAuth && document.getElementById('panel').classList.contains('abierto')) {
    cargarTodas().then(pintarPanel);
  }
}
function sumaDias(iso, n) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y,m-1,d); dt.setDate(dt.getDate()+n);
  return dt.toLocaleDateString('en-CA');
}

document.getElementById('prevDia').onclick = () => setFecha(sumaDias(S.fecha,-1));
document.getElementById('nextDia').onclick = () => setFecha(sumaDias(S.fecha,1));
document.getElementById('btnHoy').onclick   = () => setFecha(isoHoy());
document.getElementById('inpFecha').onchange = e => setFecha(e.target.value);
document.getElementById('btnApartar').onclick = () => abrirReserva();
document.getElementById('btnAdmin').onclick   = abrirAdmin;
document.getElementById('cerrarPanel').onclick = cerrarPanel;
document.getElementById('velo').onclick = e => { if (e.target === document.getElementById('velo')) cerrarModal(); };

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
document.getElementById('inpFecha').value = S.fecha;
document.getElementById('diaTxt').textContent = fmtFecha(S.fecha);
renderSedes();
cargarSede();
showTipIfNeeded();
</script>
